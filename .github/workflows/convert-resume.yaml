name: Convert Resume

on:
  push:
    paths:
      - resume.json
      - theme/**

jobs:
  convert-resume: 
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.WEBSITE_BOT_PAT }}
    
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
        
      - name: Install dependencies
        run: npm ci && npx puppeteer browsers install chrome-headless-shell

      - name: Validate resume.json against the JSON Resume schema
        run: npm run resume:validate

      - name: JSON -> PDF (one-page, print-friendly theme in ./theme)
        run: npm run resume:pdf -- --puppeteer-arg=--no-sandbox

      - name: Commit PDF
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git add ./public/Noah_Burnette_Resume.pdf
          git commit -m "Updated Noah_Burnette_Resume.pdf from GH Actions"
          git push
       
